services:
  postgres:
    image: postgres:16-alpine
    container_name: green_corner_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: green_corner
      POSTGRES_PASSWORD: green_corner
      POSTGRES_DB: green_corner
    ports:
      - "5432:5432"
    volumes:
      - green_corner_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U green_corner -d green_corner"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  green_corner_pgdata:
